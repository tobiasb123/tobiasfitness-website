<div class="form-container">
  <app-contact-header></app-contact-header>
  <form [formGroup]="formGroup" (submit)="onSubmit($event)">
    <app-contact-service-step
      [services]="serviceFormComponents()"
      [loading]="servicesLoading()"
      [error]="servicesError()"
      [active]="currentStep() === 'service'"
      [selectedService]="selectedService()"
      (serviceSelected)="onServiceSelected($event)"
      (nextRequested)="goToSchedule()"
    ></app-contact-service-step>

    @if (currentStep() === 'schedule' && scheduleLoading()) {
      <p class="schedule-message loading-description" role="status">Henter bookingstider...</p>
    } @else if (currentStep() === 'schedule' && scheduleError()) {
      <div class="schedule-message" role="alert">
        <p>{{ scheduleError() }}</p>
        <button type="button" (click)="loadSchedule()">Prøv igen</button>
        <button type="button" (click)="goToService()">Tilbage</button>
      </div>
    }

    @if (!scheduleLoading() && !scheduleError()) {
      <app-contact-schedule-step
        [active]="currentStep() === 'schedule'"
        [showButtonGroup]="showButtonGroup()"
        [hourOptions]="hourOptions()"
        [blockedWeekdays]="blockedDays()"
        [bookedSlots]="bookedSlots()"
        [isBooking]="isBooking()"
        [dateControl]="dateControl"
        [timeControl]="timeControl"
        (backRequested)="goToService()"
      ></app-contact-schedule-step>
    }
  </form>
</div>
