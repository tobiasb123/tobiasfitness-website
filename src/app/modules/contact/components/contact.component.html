<div class="form-container">
  <app-contact-header></app-contact-header>
  <form [formGroup]="formGroup" (submit)="onSubmit($event)">
    <app-contact-service-step
      [services]="serviceFormComponents()"
      [loading]="servicesLoading()"
      [error]="servicesError()"
      [active]="currentStep() === 'service'"
      [selectedService]="selectedService()"
      (serviceSelected)="onServiceSelected($event)"
      (nextRequested)="goToSchedule()"
    ></app-contact-service-step>

    <app-contact-schedule-step
      [active]="currentStep() === 'schedule'"
      [showButtonGroup]="showButtonGroup()"
      [hourOptions]="hourOptions"
      [dateControl]="dateControl"
      [timeControl]="timeControl"
      (backRequested)="goToService()"
    ></app-contact-schedule-step>
  </form>
</div>
