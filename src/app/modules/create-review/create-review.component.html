<section class="review-shell">
  <form class="review-card" (submit)="onSubmit(file)" [formGroup]="formGroup">
    <div class="card-header">
      <p class="eyebrow">Review</p>
      <h1>Opret Anmeldelse</h1>
      <p class="intro">Del dit indtryk og upload et billede, så andre kan se din oplevelse.</p>
    </div>

    <div class="file">
      <input
        #file
        id="fileInput"
        type="file"
        style="display: none"
        (input)="displayFileName(file.files?.[0]?.name)"
        [formControl]="imageControl"
      />
      <img src="upload image.png" id="uploadBtn" (click)="selectFile($event)" />
      <span id="fileName">Ingen Fil</span>
    </div>

    <div class="form-element">
      <label for="review">Din Anmeldelse</label>
      <textarea name="review" id="review" [formControl]="reviewControl"></textarea>
    </div>

    <div class="form-element">
      <label for="rating">Rating (1-5)</label>
      <input
        id="rating"
        name="rating"
        type="number"
        min="1"
        max="5"
        [formControl]="ratingControl"
      />
      @if (ratingControl.invalid && ratingControl.touched) {
        <small>*Rating skal vaere mellem 1 og 5.</small>
      }
    </div>

    <button class="submitButton" type="submit" [disabled]="isUploading()">
      {{ isUploading() ? 'Oploader...' : 'Anmeld' }}
    </button>
  </form>
</section>
