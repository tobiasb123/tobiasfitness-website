<section class="section-1" aria-labelledby="hero-title">
  <div class="hero-content">
    <h1 id="hero-title" class="headline">TobiasFitness</h1>
    <p class="hero-intro">
      Personlig træning, kostvejledning og realistiske vaner, der hjælper dig med at skabe
      resultater, som holder.
    </p>
    <button class="contact-button" type="button" (click)="bookAppointment()">Bestil en tid</button>

    <div class="social-links">
      <div class="socials">
        <a
          class="instagram social-button"
          aria-label="Åbn TobiasBastholmFitness på Instagram"
          (click)="goToLink('https://www.instagram.com/tobiasbastholmfitness/')"
        ></a>
        <a
          class="social-label"
          (click)="goToLink('https://www.instagram.com/tobiasbastholmfitness/')"
          >Instagram</a
        >
      </div>

      <div class="socials">
        <a
          class="facebook social-button"
          aria-label="Åbn TobiasBastholm på Facebook"
          (click)="goToLink('https://www.facebook.com/groups/4475864979317379')"
        ></a>
        <a
          class="social-label"
          (click)="goToLink('https://www.facebook.com/groups/4475864979317379')"
          >Facebook</a
        >
      </div>
    </div>
  </div>
</section>
