<div class="home-page">
  <app-home-hero
    [images]="heroImages()"
    [loading]="heroImagesLoading()"
    [isAdmin]="!!userProfile?.admin"
    (imagesChanged)="loadHeroImages()"
  ></app-home-hero>
  <app-home-process></app-home-process>
  <app-home-intro></app-home-intro>
  <app-home-reviews
    [reviews]="reviews()"
    [loading]="reviewsLoading()"
    [loadFailed]="reviewsLoadFailed()"
    [hasReviews]="hasReviews()"
    (createReviewRequested)="createReview()"
  ></app-home-reviews>
</div>
