<section class="auth-page" aria-labelledby="signin-title">
  <div class="auth-card">
    <h1 id="signin-title">Log Ind</h1>
    <p class="auth-intro">Log ind for at fortsætte til din konto.</p>
    <form class="auth-form" [formGroup]="formGroup" (submit)="onSubmit($event)">
      <div class="form-element">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="john.doe@example.com"
          [formControl]="emailControl"
        />
        @if (emailControl.invalid && emailControl.touched) {
          <small class="form-error">*Email er inkorrect.</small>
        }
      </div>

      <div class="form-element">
        <label for="password">Kodeord</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="kodeord"
          [formControl]="passwordControl"
        />
        @if (passwordControl.invalid && passwordControl.touched) {
          <small class="form-error">*Kodeord er påkrævet.</small>
        }
      </div>

      <div class="remember-me">
        <label for="remember-me">Husk Mig</label>
        <input
          id="remember-me"
          name="remember-me"
          type="checkbox"
          [formControl]="rememberMeControl"
        />
      </div>

      <button type="submit">Log ind</button>

      <a class="auth-switch" routerLink="/signup">Opret konto</a>
    </form>
  </div>
</section>
