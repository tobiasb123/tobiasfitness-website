<button type="button" class="recipe-card" (click)="selectRecipe()">
  <img
    class="recipe-image"
    [src]="imageUrl()"
    alt=""
    loading="lazy"
    (error)="onImageError()"
  />
  <span class="info">
    <span class="title">{{ recipe().recipe?.title || 'Opskrift' }}</span>
    <span class="details">
      <span class="details-content">
        <span>Kalorier: {{ recipe().recipe?.macros?.[0] || '-' }}</span>
        <span>Protein: {{ recipe().recipe?.macros?.[1] || '-' }}</span>
        <span>Kulhydrater: {{ recipe().recipe?.macros?.[2] || '-' }}</span>
        <span>Fedt: {{ recipe().recipe?.macros?.[3] || '-' }}</span>
        <span class="time-created">Oprettet {{ recipe().timeCreated }}</span>
      </span>
    </span>
  </span>
</button>
