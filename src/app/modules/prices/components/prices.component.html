<div class="prices-page">
  @if (userProfile?.admin) {
    <app-prices-admin-panel
      [services]="generalServices()"
      [open]="adminPanelOpen()"
      (toggleRequested)="toggleAdminPanel()"
    ></app-prices-admin-panel>
  }

  <app-prices-services-list
    [services]="generalServices()"
    [loading]="servicesLoading()"
    [error]="servicesError()"
  ></app-prices-services-list>

  @if (isLoggedIn()) {
    <a class="to-contact" (click)="navigateTo('contact')">Bestil Tid</a>
  } @else {
    <a class="to-contact" (click)="navigateTo('signin')">Bestil Tid</a>
  }
</div>
