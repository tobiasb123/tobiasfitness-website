<div class="body">
  <app-admin-sidebar
    [activeView]="activeView()"
    [searchQuery]="searchQuery()"
    [selectedUser]="selectedUser()"
    [isLibraryRecipeSelected]="isLibraryRecipeSelected()"
    (viewSelected)="selectView($event)"
    (searchChanged)="searchQuery.set($event)"
    (openEditorRequested)="openEditer()"
  ></app-admin-sidebar>

  <div class="list-container">
    <app-admin-stats
      [usersCount]="allUsers().length"
      [bookingsCount]="bookings().length"
      [recipesCount]="recipes().length"
      [selectedUserInitial]="selectedUser() ? selectedUser()!.firstName?.charAt(0) || '—' : '—'"
    ></app-admin-stats>

    @switch (activeView()) {
      @case ('Profiler') {
        <app-admin-profiles-list
          [profiles]="filteredUsers()"
          [hasActiveSearch]="hasActiveSearch()"
          (profileSelected)="selectUser($event)"
          (profileOpened)="openUserEditor($event)"
        ></app-admin-profiles-list>
      }
      @case ('Bookinger') {
        <div class="booking-tabs" role="tablist" aria-label="Bookingadministration">
          <button
            id="appointments-tab"
            role="tab"
            [attr.aria-selected]="bookingTab() === 'appointments'"
            aria-controls="appointments-panel"
            [class.active]="bookingTab() === 'appointments'"
            (click)="selectBookingTab('appointments')"
          >
            Bookinger
          </button>
          <button
            id="availability-tab"
            role="tab"
            [attr.aria-selected]="bookingTab() === 'availability'"
            aria-controls="availability-panel"
            [class.active]="bookingTab() === 'availability'"
            (click)="selectBookingTab('availability')"
          >
            Bookingstider
          </button>
        </div>
        <div
          id="appointments-panel"
          role="tabpanel"
          aria-labelledby="appointments-tab"
          [hidden]="bookingTab() !== 'appointments'"
        >
          <app-admin-bookings-list
            [bookings]="filteredBookings()"
            [hasActiveSearch]="hasActiveSearch()"
            (bookingSelected)="selectUser($event)"
            (bookingOpened)="openUserEditor($event)"
          ></app-admin-bookings-list>
        </div>
        <div
          id="availability-panel"
          role="tabpanel"
          aria-labelledby="availability-tab"
          [hidden]="bookingTab() !== 'availability'"
        >
          <app-booking-availability></app-booking-availability>
        </div>
      }
      @case ('Opskrifter') {
        <app-admin-recipes-list
          [recipes]="filteredRecipes()"
          [hasActiveSearch]="hasActiveSearch()"
          [selectedRecipeId]="selectedRecipe()?.id"
          [allUsers]="allUsers()"
          (recipeSelected)="selectRecipe($event)"
        ></app-admin-recipes-list>
      }
    }
  </div>
</div>

@if (selectedUser() && !selectedRecipe()) {
  <app-data-editer
    class="editer"
    [selectedUser]="selectedUser()"
    [selectedRecipeInput]="selectedRecipe()"
    [users]="allUsers()"
    [recipeOnlyMode]="false"
  ></app-data-editer>
}

@if (selectedRecipe() && recipeEditorOpen()) {
  <app-recipe-editer
    [selectedRecipe]="selectedRecipe()"
    [users]="allUsers()"
    (closed)="closeRecipeEditor()"
    (deleted)="handleRecipeDeleted($event)"
  ></app-recipe-editer>
}
