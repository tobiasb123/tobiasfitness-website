<div class="bg"></div>
<div class="data-editer">
  <div class="modal-header">
    <div>
      <p class="eyebrow">Admin</p>
      <h2>Rediger bruger og bookinger</h2>
    </div>
  </div>

  @if (!recipeOnlyMode) {
    <div class="nav-bar">
      <button class="ebn" [class.active]="activeTab() === 'Oversigt'" (click)="openTab('Oversigt')">
        Oversigt
      </button>
      <button class="ebn" [class.active]="activeTab() === 'Tider'" (click)="openTab('Tider')">
        Tider
      </button>
      <button class="ebn" [class.active]="activeTab() === 'Profil'" (click)="openTab('Profil')">
        Profil
      </button>
    </div>
  }

  @if (!recipeOnlyMode) {
    @switch (activeTab()) {
      @case ('Oversigt') {
        <app-data-editer-overview-tab
          [selectedUser]="selectedUser"
          [bookings]="bookings()"
        ></app-data-editer-overview-tab>
      }
      @case ('Tider') {
        <app-data-editer-schedule-tab
          [bookings]="bookings()"
          [selectedUserUid]="selectedUser?.uid"
          [selectedBooking]="selectedBooking()"
          [isDeleteConfirmationOpen]="isDeleteConfirmationOpen()"
          [isBookingCommandLoading]="isBookingCommandLoading()"
          (bookingSelected)="updateSelectedBooking($event)"
          (editRequested)="openEditTab()"
          (deleteRequested)="requestDeleteBooking()"
          (confirmDeleteRequested)="confirmDeleteBooking()"
          (cancelDeleteRequested)="cancelDeleteBooking()"
        ></app-data-editer-schedule-tab>
      }
      @case ('Profil') {
        <app-data-editer-profile-tab
          [firstNameControl]="firstNameControl"
          [lastNameControl]="lastNameControl"
          [ageControl]="ageControl"
          [emailControl]="emailControl"
          [phonenumberControl]="phonenumberControl"
          [addressControl]="addressControl"
          [zipCodeControl]="zipCodeControl"
          [townControl]="townControl"
          [commentControl]="commentControl"
        ></app-data-editer-profile-tab>
      }
      @case ('Edit') {
        <app-data-editer-booking-edit-tab
          [serviceControl]="serviceControl"
          [timeControl]="timeControl"
          [dateControl]="dateControl"
          [hourOptions]="hourOptions"
          [serviceOptions]="serviceOptions"
          [isBookingCommandLoading]="isBookingCommandLoading()"
          [isDeleteConfirmationOpen]="isDeleteConfirmationOpen()"
          (saveRequested)="editBooking()"
          (deleteRequested)="requestDeleteBooking()"
          (backRequested)="openTab('Tider')"
          (confirmDeleteRequested)="confirmDeleteBooking()"
          (cancelDeleteRequested)="cancelDeleteBooking()"
        ></app-data-editer-booking-edit-tab>
      }
    }
  }

  <div class="option-buttons">
    <button (click)="save()">Gem</button>
    <button (click)="closeEditer()">Luk</button>
  </div>
</div>
